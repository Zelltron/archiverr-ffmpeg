name: build

# Native amd64 build of the image. The build-stage hardware assertions and the
# verify stage (runs the tree inside node:20-trixie-slim) are the test. Both
# driver variants are built so a VA_DRIVERS value can never rot unnoticed.
on:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        va_drivers: ['intel', 'intel,amd']
    steps:
      - uses: actions/checkout@v4
      - name: Build image (assertions + verify stage)
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} --build-arg VA_DRIVERS="${{ matrix.va_drivers }}" -t archiverr-ffmpeg:ci .
      - name: Show VERSION, DRIVERS and staged driver files
        run: |
          docker run --rm archiverr-ffmpeg:ci cat /tree/VERSION /tree/DRIVERS
          docker run --rm archiverr-ffmpeg:ci sh -c 'ls -la /tree/lib/dri /tree/lib/libmfx-gen.so.* 2>/dev/null; du -sh /tree'
          docker image ls archiverr-ffmpeg:ci --format '{{.Size}}'
      # Vulnerability scan of what the tree really ships (the Debian libraries
      # in lib/ and FFmpeg, described by /sbom), not the Alpine staging layer.
      # Docker Scout needs a Docker Hub login: the step runs once the repo has
      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets (the same Docker Hub org
      # token as Archiverr's) and is skipped otherwise. Report only; the gate
      # stays the build itself. Archiverr's docker-scout.yml scans the
      # published tag on a schedule.
      - name: Extract scanner root
        if: matrix.va_drivers == 'intel'
        run: |
          docker create --name sbom archiverr-ffmpeg:ci
          docker cp sbom:/sbom ./sbom-root
          docker rm sbom
          grep -c '^Package:' sbom-root/var/lib/dpkg/status
      - name: Log in to Docker Hub
        id: hub
        if: matrix.va_drivers == 'intel' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker Scout (bundled libraries and FFmpeg)
        if: steps.hub.outcome == 'success'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: fs://./sbom-root
          organization: archiverr
          only-severities: critical,high
          summary: true
