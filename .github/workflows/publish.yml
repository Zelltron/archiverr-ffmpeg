name: publish

# Publishes the sidecar image to ghcr.io/zelltron/archiverr-ffmpeg so installs
# (NAS app stores above all) can pull it instead of building FFmpeg locally.
#
# The image is GPL; it is published only for a GitHub release that already
# carries the corresponding source (`./mirror-sources.sh` output attached, see
# MAINTENANCE.md "Release checklist"). The release is the trigger, and the job
# refuses to push if the release has no assets.
#
# amd64 ships VA_DRIVERS=intel (the compose default). intel,amd and none stay
# local-build options.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v2.2.0)
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zelltron/archiverr-ffmpeg
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Release carries the corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a release tag: $TAG"; exit 1;; esac
          n=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          echo "$TAG has $n release assets"
          test "$n" -gt 0 || { echo "attach ./mirror-sources.sh output to the release first"; exit 1; }

  build:
    needs: check-sources
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # GIT_COMMIT is the tag, as in the compose build context, so a pulled
      # image and a locally built one carry the same revision label.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_COMMIT=${{ env.TAG }}
            VA_DRIVERS=intel
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create multi-arch tag
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$TAG"
